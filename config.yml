#--------------------- DB ----------------------
# DB Connection with the uri (host)
client: "mongodb://localhost:27017/"

# db name
db: "aiot_course"

# db collection
col: "aiot_course_collection"

#--------------------- Dataframe Instantiation ----------------------
# Dataframe columns list
order: ["hand_acc16_x", "hand_acc16_y", "hand_acc16_z", "hand_gyro_x", "hand_gyro_y", "hand_gyro_z"]
rename: ["acc_x", "acc_y", "acc_z", "gyro_x", "gyro_y", "gyro_z"]

#--------------------- Dataset Local Storage ----------------------
# dataset location
data_path: "./PAMAP2_Dataset/Protocol/"
# single data instance location path to experiment with the data engineering process and visualization
single_instance_path: "./PAMAP2_Dataset/Protocol/subject101.dat"


#--------------------- Data Engineering ----------------------
# sliding window algorithm parameters
sliding_window:
  ws: 500 # window size is 5 seconds (100Hz sampling rate) -> 500 samples
  overlap: 250 # overlap ratio is 50% -> 250 samples
  w_type: "hann" # window type for the sliding window algorithm
  w_center: True # whether to center the window or not
  print_stats: True # whether to print the statistics of the generated windows or not

# window to handle for visualization purposes
x_number: 2

# filtering parameterization
filter:
  order: 4 # 4 is a common choice for the order of the Butterworth filter
  wn: 0.4 # cutoff frequency normalized to the Nyquist frequency 
  type: "lowpass"
  fs: 100 # sampling frequency of the data (100Hz for PAMAP2)


#--------------------- $ Data Preparation ----------------------
# Dimensionality reduction
PCA:
  n_comp: 0.95 # retain 95% of the variance


#--------------------- Learning ----------------------
# Classifier - Statistical
classifier:
  SVC:
    C: 50 # regularization parameter
    kernel: "rbf" # kernel type
    gamma: "auto" # kernel coefficient
    class_weight: "balanced" # class weight for handling imbalanced datasets
  RandomForest:
    n_estimators: 100 # number of trees in the forest
    max_depth: 10 # maximum depth of the tree
    class_weight: "balanced" # class weight for handling imbalanced datasets

# Parameter Grid for Fine-tuning, for instance, a Grid Search classifier
fine_tune:
  # GridSearchCV parameters for aggressive search
  grid_search:
    factor: 3 # reduction factor: progressively reduce candidate pool
    resource: 'n_samples' # resource allocation strategy
    max_resources: 'auto' # maintain optimality of halving
    min_resources: 1 # start with the smallest budget
    scoring: 'f1_macro'

  SVC:
    param_grid:
      # Lower C values to increase regularization
      C: [0.1, 1, 10] 
      # Smaller gamma to prevent the kernel from being too "wiggly"
      gamma: [0.01, 0.1, 'scale'] 
      kernel: ['rbf']
      class_weight: ['balanced']
    cv: 5 

  RandomForest:
    param_grid:
      - n_estimators: [100, 200]    # More trees for stability
        max_depth: [10, 20, null]     # Capping depth prevents memorizing specific subjects
        min_samples_leaf: [2, 4]    # Prevents trees from creating nodes for single outliers
        max_features: ['sqrt'] 
        class_weight: ['balanced']
    cv: 5